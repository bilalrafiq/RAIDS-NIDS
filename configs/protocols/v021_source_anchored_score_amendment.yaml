score_correction:
  contract_version: 1.0-v021-source-anchored-max-scale
  problem: >
    Target-reference-only standardization allowed dimensions with very small
    variance in the first 5,000 target flows to dominate the RMS displacement
    score.
  reference_mean_source: target_reference_windows_0_to_9
  reference_std_source: target_reference_windows_0_to_9
  anchor_std_source: source_training_embedding_only
  effective_scale_formula: max(target_reference_std_j, source_training_std_j, epsilon)
  score_formula: rms((target_window_mean_j - target_reference_mean_j) / effective_scale_j)
  epsilon: 0.000001
  pca_components: 0
  target_post_change_rows_used_for_scale: false
  target_labels_used_for_scale: false
  elementwise_clipping_added: false
  guard_normalization_clip: 8

events:
  source_protocol_id: RAIDS-NIDS-v0.20-external-guard-amendment
