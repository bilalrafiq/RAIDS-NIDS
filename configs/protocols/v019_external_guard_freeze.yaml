protocol_id: RAIDS-NIDS-v0.19-external-guard-comparison
frozen_on: 2026-07-23
status: frozen_before_v019_outcomes
relationship_to_v018:
  v018_evidence_unchanged: true
  extension_role: confirmatory_external_replication
  untouched_validation_claim: false
  prior_exposure_note: >
    NF-UNSW-NB15-v3 was inspected in an earlier pilot. The v0.19 settings are
    frozen before the new guard-comparison outcomes, but the dataset is not
    described as untouched external validation.

dataset:
  name: NF-UNSW-NB15-v3
  expected_rows: 2365424
  expected_features: 53
  label_column: Attack
  binary_label_column: Label
  time_column: FLOW_START_MILLISECONDS
  end_time_column: FLOW_END_MILLISECONDS
  official_download_page: https://staff.itee.uq.edu.au/marius/NIDS_datasets/
  local_raw_path: data/raw/NF-UNSW-NB15-v3.csv

episodes:
  prespecified_order:
    - DoS
    - Exploits
    - Reconnaissance
  replacement_after_outcome: prohibited
  selection_rule: earliest_temporally_eligible_held_out_family_occurrence
  source_max_rows: 500000
  source_minimum_per_class: 500
  warmup_rows: 20000
  post_change_rows: 100000
  maximum_warmup_and_onset_gap_hours: 24
  require_all_warmup_rows_benign: true
  source_strictly_precedes_target: true
  source_excludes_emerging_family: true
  prior_family_occurrences_allowed_but_reported: true
  failure_handling: retain_in_prespecified_denominator

model:
  type: prototype
  rejection_quantile: 0.95
  memory_per_class: 500
  pca_components: 0
  preprocessing_fit_on_source_only: true

stream:
  detection_window_size: 500
  evaluation_window_size: 5000
  true_change_window: 40
  reference_windows: [0, 10]
  calibration_windows: [10, 30]
  guard_windows: [30, 40]
  monitoring_start_window: 40
  shift_score: standardized_rms_embedding_mean_displacement
  robust_normalization_clip: 8
  target_labels_used_by_guards: false

guards:
  common:
    one_shot: true
    unknown_rate_threshold: 1.1
    common_input: >
      The same window-level shift score is centered and scaled using the
      calibration median and scaled MAD, then clipped to [-8, 8].
    candidate_selection: most_sensitive_prespecified_candidate_with_zero_guard_triggers
    failure_handling: fail_closed
  mad:
    multipliers: [3, 4, 5, 6]
    consecutive_windows: 2
  adwin:
    implementation: river-0.25.0
    delta_candidates: [0.1, 0.05, 0.01, 0.005, 0.002]
    clock: 1
    max_buckets: 5
    min_window_length: 5
    grace_period: 10
  page_hinkley:
    implementation: river-0.25.0
    threshold_candidates: [5, 10, 20, 50]
    min_instances: 10
    delta: 0.005
    alpha: 0.9999
    mode: up

replication:
  model_seeds: [11, 22, 33, 44, 55, 66, 77, 88, 99, 110]
  paired_score_trace_across_guards: true
  model_seeds_are_computational_replicates: true

outcomes:
  primary:
    - guard_deployment_status
    - post_change_detection_status
    - detection_delay_windows
  secondary:
    - selected_candidate
    - guard_safe_candidate_count
    - calibration_trigger_count
    - trigger_shift_score
  downstream_check:
    status: planned_after_guard_benchmark
    acquisition: random_nested
    label_budget: 50
    query_seed: 11
    update_rule: replay

integrity:
  predictions_before_updates: true
  post_change_labels_not_used_for_selection: true
  exact_score_trace_hash_required: true
  raw_dataset_hash_required: true
  derived_event_hashes_required: true
  failed_events_and_guards_retained: true
