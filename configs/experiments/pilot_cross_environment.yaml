# Replace source/target references after E01 audit and label harmonization.
name: E03_E06_cross_environment_pilot
seed: 11
source_dataset: configs/datasets/nf_unsw_nb15_v2.yaml
target_dataset: configs/datasets/nf_cse_cic_ids2018_v2.yaml
output_root: results/runs
scenario:
  name: natural_cross_environment
  holdout_labels: []
stream:
  mode: chronological
  window_size: 1000
method:
  name: adaptive_prototype_1pct
  type: prototype
  pca_components: 32
  rejection_quantile: 0.95
  memory_per_class: 1000
adaptation:
  enabled: true
  label_budget_fraction: 0.01
  max_queries_per_event: 50
  selection: uncertainty_diversity
  candidate_multiplier: 5
  drift:
    mean_shift_threshold: 1.25
    unknown_rate_threshold: 0.20
    min_windows_between: 3
metrics:
  recovery_fraction: 0.95
  recovery_patience_windows: 2

