[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raids-nids"
version = "0.1.11"
description = "Resilience-aware open-world network intrusion detection experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.13,<2",
  "PyYAML>=6,<7",
  "joblib>=1.4,<2",
  "psutil>=5.9,<8",
  "river==0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
raids-nids = "raids_nids.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
