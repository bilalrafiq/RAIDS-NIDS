name: E02_E05_UNSW_decoupled_static_check_v013
seed: 11
source_dataset: configs/datasets/nf_unsw_nb15_v3_source_pilot.yaml
target_dataset: configs/datasets/nf_unsw_nb15_v3_target_session_aligned_pilot.yaml
output_root: results/runs
scenario:
  name: supported_6class_capture_session_and_prevalence_shift
  holdout_labels: []
stream:
  mode: chronological
  window_size: 500
  true_change_window: 40
method:
  name: prototype_static_closed
  type: prototype
  open_set: false
  pca_components: 12
  rejection_quantile: 0.95
  memory_per_class: 500
adaptation:
  enabled: false
  label_budget_fraction: 0.0
  trigger_mode: drift
  drift:
    mean_shift_threshold: 1.25
    unknown_rate_threshold: 0.2
    min_windows_between: 2
metrics:
  recovery_fraction: 0.95
  recovery_patience_windows: 2
  evaluation_window_size: 5000
  recovery_patience_evaluation_blocks: 3
  normal_labels:
  - Benign
  minimum_evaluation_known_classes: 6
  minimum_evaluation_rows_per_known_class: 5
  minimum_evaluation_non_normal_rows: 100
