name: E00_smoke_adaptive
seed: 11
source_dataset: configs/datasets/synthetic_source.yaml
target_dataset: configs/datasets/synthetic_target.yaml
output_root: results/runs
scenario:
  name: synthetic_novel_classes
  holdout_labels: []
stream:
  mode: controlled_novelty
  window_size: 250
  known_prefix_fraction: 0.3
method:
  name: adaptive_prototype_1pct
  type: prototype
  pca_components: 12
  rejection_quantile: 0.95
  memory_per_class: 300
adaptation:
  enabled: true
  label_budget_fraction: 0.01
  max_queries_per_event: 20
  selection: uncertainty_diversity
  candidate_multiplier: 5
  drift:
    mean_shift_threshold: 1.25
    unknown_rate_threshold: 0.2
    min_windows_between: 2
metrics:
  recovery_fraction: 0.95
  recovery_patience_windows: 2
